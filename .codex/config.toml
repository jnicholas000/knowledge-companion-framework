# Project-scoped defaults for trusted Codex sessions.
# Network remains disabled by default under workspace-write. Enable it only in user config or a
# specific session when the task requires outbound access.

model_reasoning_summary = "none"
model_verbosity = "low"

sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[agents]
max_concurrent_threads_per_session = 1
