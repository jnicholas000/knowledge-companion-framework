schema_version: "1.0"
id: example.authoring-corpus.evaluation.case
version: 1.0.0
title: Explain the authoring corpus control
description: Verify that the minimal fixture can anchor snapshot diagnostic cases.
input:
  query: What is the authoring corpus control?
  mode: explain
  audience: framework contributor
  constraints: []
fixture:
  pack_id: example.authoring-corpus
  pack_version: 0.1.0
  snapshot_id: authoring-corpus-v1
  record_ids: [example.authoring-corpus.concept.record]
expectations:
  required_behaviors: [Describe the control as a fictional test fixture.]
  prohibited_behaviors: [Present the fixture as production knowledge.]
  required_evidence_ids: [example.authoring-corpus.evidence.source]
evaluator_method: hybrid
rubric:
  dimensions:
    - name: reasoning_quality
      weight: 0.5
      criteria: The response distinguishes fixture structure from production truth.
    - name: evidence
      weight: 0.5
      criteria: The response uses the required local evidence.
  pass_threshold: 0.8
provenance:
  created_at: "2026-08-07T12:00:00Z"
  created_by: { id: example.maintainer, type: human }
  last_modified_at: "2026-08-07T12:00:00Z"
  last_modified_by: { id: example.maintainer, type: human }
